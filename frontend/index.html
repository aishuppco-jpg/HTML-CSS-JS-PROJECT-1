<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Complaint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background"></div>
  <main class="container">
    <h1>File a Complaint</h1>
    <form id="complaintForm" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required />
      </div>
      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="Your city" required />
      </div>
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required />
      </div>
      <div class="form-group">
        <label for="complaint">Complaint</label>
        <textarea id="complaint" name="complaint" rows="4" placeholder="Describe your complaint" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit</button>
    </form>
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
